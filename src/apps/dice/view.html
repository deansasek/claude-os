<!-- the shell draws the icon and "Dice" (core/web/app-header.ts) -->
<div class="dc">
  <div class="dc-count" id="dcCount" role="group" aria-label="How many dice">
    <button data-count="1">1</button><button data-count="2">2</button><button data-count="3">3</button>
    <button data-count="4">4</button><button data-count="5">5</button><button data-count="6">6</button>
  </div>
  <div class="dc-dice" id="dcDice" aria-live="polite"></div>
  <div class="dc-sum" id="dcSum"></div>
  <div class="dc-btns">
    <button class="dc-btn primary" id="dcRoll">Roll</button>
    <button class="dc-btn" id="dcCoin">Flip a coin</button>
  </div>
  <div class="dc-coin" id="dcCoinOut" aria-live="polite"></div>
</div>
