<header class="app-hd">   <!-- the shell draws the icon and "Calendar" (core/web/app-header.ts) -->
  <div class="app-hd-right">
    <button class="cal-hbtn" id="calAddBtn">Add event</button>
    <button class="cal-hbtn" id="calRefresh">Refresh</button>
  </div>
</header>

<!-- move through the calendar, pick the view, and see what it covers -->
<div class="cal-bar">
  <div class="cal-nav">
    <button class="cal-ic hit" id="calPrev" aria-label="Previous">‹</button>
    <button class="cal-ic hit" id="calNext" aria-label="Next">›</button>
    <button class="cal-hbtn" id="calToday">Today</button>
  </div>
  <h2 class="cal-title" id="calTitle"></h2>
  <div class="cal-views" role="tablist" aria-label="View">
    <button class="cal-seg hit" id="calV-day" role="tab">Day</button>
    <button class="cal-seg hit" id="calV-week" role="tab">Week</button>
    <button class="cal-seg hit" id="calV-month" role="tab">Month</button>
    <button class="cal-seg hit" id="calV-year" role="tab">Year</button>
  </div>
</div>

<p class="cal-note" id="calNote" hidden></p>

<!-- one chip per calendar: tap to show or hide its events (web/calendars.ts) -->
<div class="cal-cals" id="calCals" role="group" aria-label="Calendars" hidden></div>

<div class="cal-body" id="calBody"></div>

<!-- Add event: filled in here, checked, and written to the Google calendar only after Yes -->
<div class="cal-add" id="calAdd" hidden>
  <div class="cal-add-card" id="calAddForm">
    <h2>Add an event</h2>
    <button class="cal-field hit" id="calAddTitle">Name: <b id="calAddTitleV">Tap to type</b></button>
    <button class="cal-field hit" id="calAddDate">Day: <b id="calAddDateV"></b></button>
    <button class="cal-field hit" id="calAddAllDay">All day: <b id="calAddAllDayV">No</b></button>
    <button class="cal-field hit" id="calAddStart">Starts: <b id="calAddStartV">09:00</b></button>
    <button class="cal-field hit" id="calAddEnd">Ends: <b id="calAddEndV">09:30</b></button>
    <button class="cal-field hit" id="calAddWhere">Where: <b id="calAddWhereV">Optional</b></button>
    <p class="cal-add-msg" id="calAddMsg" hidden></p>
    <div class="cal-add-row">
      <button class="cal-btn" id="calAddCancel">Cancel</button>
      <button class="cal-btn cal-btn-primary" id="calAddReview">Review</button>
    </div>
  </div>
  <div class="cal-add-card" id="calAddConfirm" hidden>
    <h2>Add to your calendar?</h2>
    <p class="cal-add-msg" id="calAddSummary"></p>
    <p class="cal-add-note">It is added to your Google calendar through the claude.ai connector.</p>
    <div class="cal-add-row">
      <button class="cal-btn" id="calAddNo">Back</button>
      <button class="cal-btn cal-btn-primary" id="calAddYes">Yes, add it</button>
    </div>
  </div>
  <div class="cal-pick" id="calPick" hidden>
    <div class="cal-pick-card" id="calPickCard"></div>
  </div>
</div>
