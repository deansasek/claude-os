<header class="app-hd">   <!-- the shell draws the icon and "Radio" (core/web/app-header.ts) -->
</header>

<!-- the page: the strip (favourites, then recently played) on the left, and the browse column on the right. The player
     bar sits along the bottom of the page, full width: the station, the transport, and the tools (sleep, volume, expand).
     Back in the browse column returns one level. -->
<div class="rd-page">
  <div class="rd-left">
    <!-- the strip: one row, favourites then recently played -->
    <div class="rd-strip">
      <section class="rd-favs-band">
        <h3 class="rd-k">Favourites</h3>
        <div class="rd-favs" id="rdFavs"></div>
        <p class="rd-empty" id="rdFavsEmpty">Tap the heart on a station to keep it here.</p>
      </section>
      <section class="rd-favs-band">
        <h3 class="rd-k">Recently played</h3>
        <div class="rd-favs" id="rdRecent"></div>
        <p class="rd-empty" id="rdRecentEmpty">Stations you play show here.</p>
      </section>
    </div>
  </div>

  <!-- the browse column -->
  <aside class="rd-find" id="rdFind">
      <button class="rd-search" id="rdSearch"><span class="rd-search-ic" id="rdSearchIc" aria-hidden="true"></span><span class="rd-search-text" id="rdQuery">Search stations</span></button>
      <div class="rd-tabs" id="rdTabs">
        <button class="rd-tab" data-tab="top">Top stations</button>
        <button class="rd-tab" data-tab="tags">Genres</button>
        <button class="rd-tab" data-tab="countries">Countries</button>
        <button class="rd-tab" data-tab="languages">Languages</button>
      </div>
      <div class="rd-bar">
        <button class="rd-back" id="rdBack" hidden>Back</button>
        <h3 class="rd-k" id="rdResHead">Top stations</h3>
      </div>
      <div class="rd-filters" id="rdFilters" hidden></div>
      <div class="rd-res" id="rdRes"></div>
      <p class="rd-empty" id="rdResEmpty" hidden></p>
      <p class="rd-src">Stations from Radio Browser</p>
    </aside>
</div>

<!-- the player bar: the station (left), the transport (centre), the tools (right) -->
<section class="rd-now rd-player" id="rdNow" aria-label="Player">
  <div class="rd-pl-station">
    <button class="rd-art-btn" id="rdArtBtn" aria-label="Station page"><span class="rd-art" id="rdArt" aria-hidden="true"></span></button>
    <div class="rd-now-text">
      <h2 class="rd-name" id="rdName">Nothing playing</h2>
      <p class="rd-title" id="rdTitle"></p>
      <p class="rd-msg" id="rdMsg" role="status" hidden></p>
    </div>
    <button class="rd-heart" id="rdNowFav" aria-label="Add to Favourites" aria-pressed="false" hidden></button>
  </div>

  <div class="rd-transport">
    <button class="rd-btn" id="rdPrev" aria-label="Previous favourite"></button>
    <button class="rd-btn rd-main-btn" id="rdToggle" aria-label="Play"></button>
    <button class="rd-btn" id="rdNext" aria-label="Next favourite"></button>
  </div>

  <div class="rd-pl-tools">
    <button class="rd-stop" id="rdSleep">Sleep</button>
    <label class="rd-vol">
      <span class="rd-vol-ic" id="rdVolIc" aria-hidden="true"></span>
      <input type="range" min="0" max="100" step="1" id="rdVol" aria-label="Volume">
    </label>
    <button class="rd-expand" id="rdExpand" aria-label="Open the station page"></button>
  </div>
</section>
