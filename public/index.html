<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeOS</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClaudeOS">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/core.css">
<script>
  // Plain (non-module) script, outside the app's module graph, so it works even when the app's modules can't load.
  // Until the app says it has started (window.hubBooted, called from shell.ts), it covers the screen with a calm
  // ClaudeOS start screen. If the app doesn't start within 8 seconds, or a module fails to load, it reports that to
  // the server log and reloads with a backoff (3s, 6s, 12s, then every 30s). A new server version reloads at once.
  // The native shell (MainActivity.java) has its own backstop for when this script never runs; keep the numbers there in step.
  (function () {
    var BOOT_MS = 8000, BACKOFF_MS = [3000, 6000, 12000], CAP_MS = 30000, POLL_MS = 3000, SHOW_AFTER_MS = 600;
    var RETRY_KEY = 'hubBootRetries';
    var booted = false, failing = false, loadedVersion = null;
    var overlay = null, showTimer = null, bootTimer = null, reloadTimer = null, poll = null;

    function send(kind, msg) {
      try {
        var x = new XMLHttpRequest();
        x.open('POST', '/api/core/log'); x.setRequestHeader('Content-Type', 'application/json');
        x.send(JSON.stringify({ kind: kind, msg: String(msg).slice(0, 500), ua: navigator.userAgent }));
      } catch (e) { /* nothing else to try */ }
    }

    // how many times this tab has retried a failed start (kept across the reloads, so the backoff grows)
    function retriesSoFar() { try { return Number(sessionStorage.getItem(RETRY_KEY)) || 0; } catch (e) { return 0; } }
    function saveRetries(n) { try { sessionStorage.setItem(RETRY_KEY, String(n)); } catch (e) { /* no storage: backoff restarts */ } }
    function forgetRetries() { try { sessionStorage.removeItem(RETRY_KEY); } catch (e) { /* ignore */ } }

    /** The server's page version, or null when the PC doesn't answer. */
    function version(cb) {
      try {
        var x = new XMLHttpRequest();
        x.open('GET', '/api/core/version?t=' + Date.now());
        x.timeout = 4000;
        x.onload = function () {
          var v = null;
          try { v = JSON.parse(x.responseText).version; } catch (e) { /* not the hub */ }
          cb(v == null ? null : v);
        };
        x.onerror = x.ontimeout = function () { cb(null); };
        x.send();
      } catch (e) { cb(null); }
    }

    function buildScreen() {
      var css = document.createElement('style');
      // colours come from the core.css tokens (loaded before this script runs in the page head); no raw colours here
      css.textContent =
        '#hub-start{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'padding:0 16px;box-sizing:border-box;background:var(--bg);color:var(--text);font-family:var(--serif);text-align:center}' +
        '#hub-start h1{font-weight:400;font-size:34px;margin:24px 0 8px;letter-spacing:-.02em}' +
        '#hub-start p{margin:4px 0;font:15px/1.45 var(--sans);color:var(--t3);min-height:1.45em}' +
        '#hub-start .hub-mark{width:96px;height:96px;fill:var(--clay);transform-origin:50% 50%;animation:hub-start-pulse 3.2s var(--ease-std) infinite}' +
        '@keyframes hub-start-pulse{0%,100%{transform:scale(.94);opacity:.8}50%{transform:scale(1.04);opacity:1}}' +
        '@media (prefers-reduced-motion:reduce){#hub-start .hub-mark{animation:none}}';
      document.head.appendChild(css);
      overlay = document.createElement('div');
      overlay.id = 'hub-start';
      overlay.setAttribute('role', 'status');
      overlay.innerHTML =
        '<svg class="hub-mark" viewBox="-50 -50 100 100" aria-hidden="true"><path d="M-22.1 -49.9L-18.1 -49.4L-16.2 -48L-9.9 -33.5L-1 -16.2L0.4 -11.8L1.1 -12L1.5 -19.6L2.7 -28.9L3.8 -42.7L5.4 -46.4L8.6 -48.4L10.9 -47.4L13 -44.3L11.6 -35.2L8.8 -22.3L7.6 -14.6L8.4 -14.6L9 -15.3L20.9 -30.4L23.4 -33.3L27.4 -37.3L29.2 -38.7L33.6 -38.7L36.6 -34.2L35.3 -29.2L21.8 -11.8L18.7 -6L19 -5.7L20.1 -5.7L32.2 -8.4L45.6 -10.7L49.2 -9L49.5 -7.3L48.2 -4.1L15.9 3.3L16.2 3.7L22.8 4.3L32.3 4.4L44.2 5.4L45.2 5.7L48.2 7.7L49.8 10.1L49.5 12L44.5 14.6L16.6 8L15.5 8.1L15.5 8.4L19.4 12.3L39 30.2L39.4 32.6L38.3 34.3L36.7 34.2L35.5 33.3L27.6 27.2L16 17.4L15.5 17.6L15.5 18.3L26.9 35.4L27.6 40.2L26.8 41.5L24.4 42.4L21.6 41.8L14.8 32.4L9.8 24.9L5.3 16.8L4.8 16.8L4.5 17.1L4.4 17.9L1.7 47L0.4 48.8L-2.6 49.9L-5.2 47.9L-6.4 45.2L-6.4 44.6L-2.1 24.5L-1 16.5L-0.3 14.1L-0.4 13.7L-1 13.7L-15.9 34.1L-22.2 40.9L-23.3 41.9L-24.8 42.6L-27.9 41.1L-27.6 38.3L-26 36L-10.4 15.8L-6 10.8L-6.1 10.2L-7.8 11L-32.8 27.3L-37.4 28L-39.4 26L-39.2 23L-38.2 21.9L-29.8 16.2L-11.2 5.9L-10.6 5.4L-10.4 4.6L-10.8 3.9L-26.3 3.5L-45.7 2.4L-47.9 1.9L-49.9 -1L-49.7 -2.4L-47.9 -3.7L-22.9 -2.1L-12.8 -0.9L-10.5 -0.9L-10.3 -1.1L-10.2 -1.6L-11.2 -2.6L-31.4 -15.9L-40.1 -22L-41.7 -24.3L-42.2 -28.3L-39.6 -31.2L-35.1 -30.8L-11.8 -13L-11.4 -12.8L-10.8 -13.3L-16.9 -25.1L-25.8 -40.1L-26.6 -43.3L-26.7 -45.4L-23.9 -49.3L-22.2 -49.8Z"/></svg>' +
        '<h1>ClaudeOS</h1><p></p>';
      document.documentElement.appendChild(overlay);
    }

    function showScreen(line) {
      if (booted) return;
      if (!overlay) buildScreen();
      overlay.querySelector('p').textContent = line;
    }

    /** The app did not start, or a module failed to load: report it, show the message, and retry. */
    function fail(msg) {
      if (booted || failing) return;
      failing = true;
      clearTimeout(bootTimer);
      send('boot', msg);
      var n = retriesSoFar();
      saveRetries(n + 1);
      var wait = n < BACKOFF_MS.length ? BACKOFF_MS[n] : CAP_MS;
      showScreen("Something didn’t load. Trying again…");
      reloadTimer = setTimeout(function () { location.reload(); }, wait);
      poll = setInterval(function () {
        version(function (v) {
          if (v === null) { showScreen("Can’t reach your PC. Trying again…"); return; }
          showScreen("Something didn’t load. Trying again…");
          if (loadedVersion === null) loadedVersion = v;
          else if (v !== loadedVersion) location.reload();   // the server has new files: pick them up now
        });
      }, POLL_MS);
    }

    window.addEventListener('error', function (e) {
      send('error', (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
      // a module in the app's graph 404'd or failed to parse: the app can't start, so don't wait for the timeout
      if (e.target && e.target.tagName === 'SCRIPT' && e.target.type === 'module') fail('a module failed to load: ' + e.target.src);
    }, true);
    window.addEventListener('unhandledrejection', function (e) { send('promise', e.reason && (e.reason.stack || e.reason.message) || e.reason); });

    // called by the app (shell.ts) once it has mounted: hide the start screen and stop the watchdogs
    window.hubBooted = function () {
      booted = true;
      clearTimeout(showTimer); clearTimeout(bootTimer); clearTimeout(reloadTimer); clearInterval(poll);
      forgetRetries();
      if (overlay) { overlay.remove(); overlay = null; }
      try { if (window.HubDevice && HubDevice.booted) HubDevice.booted(); } catch (e) { /* not on the tablet */ }
    };

    showTimer = setTimeout(function () { showScreen('Starting up…'); }, SHOW_AFTER_MS);   // a normal start never shows it
    version(function (v) { loadedVersion = v; });
    bootTimer = setTimeout(function () { fail('the app did not start within 8 seconds'); }, BOOT_MS);
  })();
</script>
<!-- ?device=mock: a pretend desk tablet for the PC (core/web/mock-device.ts), loaded before the app's modules -->
<script>if (/[?&]device=mock\b/.test(location.search)) document.write('<script src="/src/core/web/mock-device.ts"><\/script>');</script>
<script type="module" src="/src/main.web.ts"></script>
</head>
<body>
<div class="stage" id="stage">
  <!-- the rail is filled in from the app list; each app's view is loaded into its own <section> -->
  <nav class="rail" id="rail">
    <div class="rail-foot"></div>
  </nav>

  <!-- shared on-screen keyboard; any app can open it with Keyboard.open({...}) -->
  <div class="kb" id="kb">
    <div class="kb-bar">
      <button class="kb-cancel" id="kbCancel">Cancel</button>
      <div class="kb-field"><span id="kbText"></span><i class="kb-caret"></i><span class="kb-ph" id="kbPh"></span></div>
      <button class="kb-paste" id="kbPaste" hidden>Paste</button>
      <button class="kb-done" id="kbDone">Done</button>
    </div>
    <div class="kb-clips" id="kbClips" hidden></div>
    <div class="kb-keys" id="kbKeys"></div>
  </div>
</div>
</body>
</html>
