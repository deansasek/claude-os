name: Clear attachments

# When an issue or pull request closes, remove its screenshots from the attachments branch.
on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Remove this item's images from the attachments branch
        env:
          ITEM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: node scripts/detach-image.ts "$ITEM"
