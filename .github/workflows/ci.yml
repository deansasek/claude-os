name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the checks
        run: npm run check
      - name: Check the test list
        run: npm run check:tests
      - name: Run the tests
        run: npm test

  # The host starts and answers on each OS. Linux, macOS and Windows.
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start the host on a free port
        shell: bash
        env:
          CLAUDEOS_STATE_DIR: ${{ runner.temp }}/host-state
        run: |
          mkdir -p "$CLAUDEOS_STATE_DIR"
          npm run host -- --port 8765 --host 127.0.0.1 --no-cast > host-run.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/core/version; then echo; exit 0; fi
            sleep 2
          done
          echo "The host did not answer."; cat host-run.log; exit 1
      - name: Stop the host
        if: always()
        shell: bash
        run: npm run host:stop -- --port 8765 || true
