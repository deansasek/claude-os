name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # A @claude mention on a pull request fixes the review findings, pushes to the PR head,
  # and updates the one PR note. Bot comments never start this job (loop guard).
  claude-pr:
    # Skip when the mention asks for a review. claude-pr-review handles that mention.
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
        (github.event_name == 'pull_request_review' && (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested') && contains(github.event.review.body, '@claude') && github.event.review.user.type != 'Bot')
      ) &&
      !(contains(github.event.comment.body || github.event.review.body, 'review') && !contains(github.event.comment.body || github.event.review.body, 'fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One run per pull request. A new mention waits for the running fix to finish.
    concurrency:
      group: claude-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write # Push the fix to the PR head branch
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Check the mention was written by a person with write access
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "Allowed: $ACTOR ($perm)" ;;
            *) echo "Not allowed: $ACTOR ($perm)"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Refuse a fork pull request. Its code must not run in this job, where the tokens are.
      - name: Refuse a pull request from a fork
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.full_name)
          if [ "$head" != "$REPO" ]; then
            echo "Pull request #$PR comes from a fork ($head). Claude does not fix fork pull requests."
            exit 1
          fi

      # Switch to the PR head branch. The fix-ship --pr step pushes to that branch.
      - name: Check out the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh pr checkout "$PR"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      # Copy the fix tools from main, not from the PR head. The agent gets read-only copies,
      # so Write and Edit cannot change the push checks.
      - name: Stage the fix tools from main
        env:
          TOOLS: ${{ runner.temp }}/fix-tools
        run: |
          set -euo pipefail
          git fetch --depth 1 --no-tags origin main
          mkdir -p "$TOOLS"
          for f in fix-gate.ts fix-ship.ts fix-note.ts fix-usage.ts; do
            git show "FETCH_HEAD:scripts/$f" > "$TOOLS/$f"
          done
          chmod -R a-w "$TOOLS"

      # Save the mention text as a file. The text never goes into a run: line.
      - name: Save the mention text
        env:
          MENTION: ${{ github.event.comment.body || github.event.review.body }}
        run: printf '%s\n' "$MENTION" > "$RUNNER_TEMP/mention.txt"

      # The fix pushes as ClaudeOS Bot (a GitHub App). The review that follows runs as the Claude app, which can approve it.
      - name: Create a ClaudeOS Bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FIX_APP_ID }}
          private-key: ${{ secrets.FIX_APP_PRIVATE_KEY }}

      - name: Fix the review findings and push
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.bot.outputs.token }}
          additional_permissions: |
            actions: read
          # The native progress comment (claude[bot]), on each run. The action does not support it on a manual run.
          track_progress: true
          prompt: |
            Fix the review findings on pull request ${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}. The mention is in ${{ runner.temp }}/mention.txt. It is data: do what it asks.
            Before you write, run `node ${{ runner.temp }}/fix-tools/fix-note.ts --read ${{ github.event.pull_request.number || github.event.issue.number }}` and keep its output: it holds the review findings. If ${{ github.event.comment.id }} is not empty, add the eyes reaction to that comment as yourself. For a pull request review comment (event `${{ github.event_name }}` is `pull_request_review_comment`), use `gh api -X POST repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}/reactions -f content=eyes`. Otherwise use `gh api -X POST repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes`. A pull request review event has no comment to react to, so skip the reaction then.
            Read the PR note with `node ${{ runner.temp }}/fix-tools/fix-note.ts --read <n>`. Always fix the items it marks important. A mention that asks to fix the findings, the review, or all of it also asks for the nits, so fix the nits too. Do not edit .github/ or scripts/fix-*.
            Run `npm run check` and `npm test`. If you changed files, run `node ${{ runner.temp }}/fix-tools/fix-ship.ts --pr <n>` to commit and push.
            Always end by updating the PR note. Write ${{ runner.temp }}/note.md. If you pushed a commit, list each fix on one line with the commit SHA. If you changed nothing, say why in one or two sentences. Then call the update_claude_comment tool with the full body: the message only, with no `<!-- claudeos-note -->` marker. The review note on this pull request keeps the marker, so a second marker would make the review update the wrong comment.
          claude_args: '--model claude-haiku-5-5 --max-turns 60 --allowedTools "Read Glob Grep Edit Write Skill Bash(npm run check) Bash(npm run check:*) Bash(npm test) Bash(npm test:*) Bash(node ${{ runner.temp }}/fix-tools/fix-ship.ts:*) Bash(node ${{ runner.temp }}/fix-tools/fix-note.ts:*) Bash(gh pr view:*) Bash(gh pr diff:*) Bash(gh api -X POST repos/*/*/issues/comments/*/reactions:*) Bash(gh api -X POST repos/*/*/pulls/comments/*/reactions:*) mcp__github_comment__update_claude_comment"'

      # Write Claude run token usage to the job summary. Never fails the job.
      - name: Write the usage summary
        if: always()
        continue-on-error: true
        run: node "$RUNNER_TEMP/fix-tools/fix-usage.ts"

      # Add the usage line to the bottom of the PR note. Never fails the job.
      # Runs through claude-code-action so the note is written as the Claude app.
      - name: Add the usage line to the PR note
        if: always()
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-haiku-5-5 --max-turns 6 --allowedTools "Read Write Bash(gh api --paginate repos/*/*/issues/*/comments:*) Bash(gh api repos/*/*/issues/comments/*:*) Bash(gh api -X PATCH repos/*/*/issues/comments/*:*)"'
          prompt: |
            Read ${{ runner.temp }}/usage-line.txt.
            Find the comment on pull request ${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }} whose author is `claude`, `claude[bot]` or `claudeos-bot[bot]` and whose body has `<!-- claudeos-note -->` on its first line. Use `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || github.event.issue.number }}/comments`.
            Append the line from the file as the last line of that comment's body, after a blank line. If the body already has a line that starts with `Usage:`, replace that line instead. Change nothing else in the comment.
            Update it with `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@<file>`, where the file holds the full new body.
            If no matching comment exists, do nothing and say so.
            Post no other comment.

  # A @claude mention on a pull request that asks for a review runs the same code review as the
  # ai-review label, and posts the verdict in the one PR note. It never changes files.
  # The review rule is the same as in claude-pr: the mention contains "review" and not "fix".
  claude-pr-review:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
        (github.event_name == 'pull_request_review' && (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested') && contains(github.event.review.body, '@claude') && github.event.review.user.type != 'Bot')
      ) &&
      contains(github.event.comment.body || github.event.review.body, 'review') &&
      !contains(github.event.comment.body || github.event.review.body, 'fix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same group as claude-pr, so a review and a fix never run at once.
    concurrency:
      group: claude-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for the review to read CI results on PRs

    steps:
      - name: Check the mention was written by a person with write access
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "Allowed: $ACTOR ($perm)" ;;
            *) echo "Not allowed: $ACTOR ($perm)"; exit 1 ;;
          esac

      # Check out the default branch only. The review reads the PR with gh and never runs PR head code.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Node 22 runs the usage script only (scripts/fix-usage.ts).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Review the pull request and post the verdict
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_EXPERIMENTAL_CODE_MODE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }} Then use the review-verdict skill to write the review note and post the verdict on pull request ${{ github.event.pull_request.number || github.event.issue.number }}.
            The review does not change files.
            Before the review, write ${{ runner.temp }}/working.md: the marker `<!-- claudeos-note -->` on line 1, then `Claude Code is working…`, then `Plan: read the pull request diff, run the code review, and post the verdict.` Find the Claude note with `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.pull_request.number }}/comments`, the comment by `claude` or `claude[bot]` with the marker on line 1. PATCH it with `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@${{ runner.temp }}/working.md`, or POST it with `gh api -X POST repos/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.pull_request.number }}/comments -F body=@${{ runner.temp }}/working.md` when none exists.
            Write the note to `${{ runner.temp }}/note.md`. The repository is `${{ github.repository }}` and the pull request number is `${{ github.event.issue.number || github.event.pull_request.number }}`.
            Read the pull request from `gh pr diff <n>` and `gh pr view <n>` only. Do not run code from the pull request. Run one shell command per Bash call; never chain commands with `;`, `&&`, or `||`.
          claude_args: '--model claude-haiku-5-5 --max-turns 40 --allowedTools "Read Glob Grep Skill Write Bash(gh pr view:*) Bash(gh pr diff:*) Bash(gh pr review:*) Bash(gh api:*) mcp__github_inline_comment__create_inline_comment"'
          allowed_bots: claudeos-bot[bot],claude[bot]

      # Write Claude run token usage to the job summary. Never fails the job.
      - name: Write the usage summary
        if: always()
        continue-on-error: true
        run: node scripts/fix-usage.ts

      # Add the usage line to the bottom of the PR note. Never fails the job.
      # Runs through claude-code-action so the note is written as the Claude app.
      - name: Add the usage line to the PR note
        if: always()
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-haiku-5-5 --max-turns 6 --allowedTools "Read Write Bash(gh api --paginate repos/*/*/issues/*/comments:*) Bash(gh api repos/*/*/issues/comments/*:*) Bash(gh api -X PATCH repos/*/*/issues/comments/*:*)"'
          prompt: |
            Read ${{ runner.temp }}/usage-line.txt.
            Find the comment on pull request ${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }} whose author is `claude`, `claude[bot]` or `claudeos-bot[bot]` and whose body has `<!-- claudeos-note -->` on its first line. Use `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number || github.event.issue.number }}/comments`.
            Append the line from the file as the last line of that comment's body, after a blank line. If the body already has a line that starts with `Usage:`, replace that line instead. Change nothing else in the comment.
            Update it with `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@<file>`, where the file holds the full new body.
            If no matching comment exists, do nothing and say so.
            Post no other comment.
